<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ZELLBURY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body class="bg-white">
    <header class="zellbury-header d-flex align-items-center justify-content-between">
        <a href="index.html" class="text-dark text-decoration-none fs-5" aria-label="Back to shop"><i class="bi bi-arrow-left"></i></a>
        <a href="index.html" class="zellbury-logo text-dark">ZELLBURY</a>
        <a href="checkout.html" class="text-dark text-decoration-none fs-5" aria-label="Cart"><i class="bi bi-bag"></i></a>
    </header>

    <main class="checkout-page">
        <h1 class="checkout-title">Checkout</h1>

        <form class="checkout-form" action="#" method="get">
            <div class="checkout-fieldsets">

                <fieldset>
                    <legend>Contact</legend>
                    <div class="form-grid">
                        <label for="fullname">Full name</label>
                        <div class="field">
                            <input type="text" id="fullname" name="fullname" required minlength="3" placeholder="Ayesha Afzal">
                            <span class="error">Enter your full name (at least 3 letters).</span>
                        </div>

                        <label for="email">Email</label>
                        <div class="field">
                            <input type="email" id="email" name="email" required placeholder="name@example.com">
                            <span class="error">Enter a valid email address.</span>
                        </div>

                        <label for="phone">Phone</label>
                        <div class="field">
                            <input type="tel" id="phone" name="phone" required pattern="03[0-9]{2}-[0-9]{7}" maxlength="12" placeholder="0300-1234567" title="Format: 03XX-XXXXXXX">
                            <span class="error">Use the format 03XX-XXXXXXX.</span>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Delivery</legend>
                    <div class="form-grid">
                        <label for="address">Address</label>
                        <div class="field">
                            <input type="text" id="address" name="address" required minlength="10" placeholder="House 12, Street 4, Gulberg">
                            <span class="error">Enter your full address (at least 10 characters).</span>
                        </div>

                        <label for="city">City</label>
                        <div class="field">
                            <select id="city" name="city" required>
                                <option value="">Select a city</option>
                                <option value="lahore">Lahore</option>
                                <option value="karachi">Karachi</option>
                                <option value="islamabad">Islamabad</option>
                                <option value="faisalabad">Faisalabad</option>
                                <option value="multan">Multan</option>
                            </select>
                            <span class="error">Please choose a city.</span>
                        </div>

                        <label for="delivery-date">Delivery date</label>
                        <div class="field">
                            <input type="date" id="delivery-date" name="delivery-date" required min="2026-10-29" max="2026-11-21">
                            <span class="error">Pick a date between 29 Oct 2026 and 21 Nov 2026.</span>
                        </div>
                    </div>
                </fieldset>

            </div>

            <button type="submit" class="checkout-submit">Place Order</button>
        </form>
    </main>

    <footer class="zellbury-footer-section bg-black text-white py-5">
        <div class="container text-center">
            <p class="footer-copyright mb-0">&copy; 2026 ZELLBURY</p>
        </div>
    </footer>
</body>
</html>
