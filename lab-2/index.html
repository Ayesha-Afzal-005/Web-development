<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar and Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">MyStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#labNavbar" aria-controls="labNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="labNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-md-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
                <div class="d-flex">
                    <a href="#" class="btn btn-outline-light position-relative">
                        <i class="bi bi-cart3"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <h2 class="mb-4 text-center text-md-start">Welcome to MyStore</h2>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" class="card-img-top p-3" alt="Placeholder">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title h6">Product Item 1</h5>
                        <p class="card-text fw-bold text-primary mb-3">$19.99</p>
                        <button class="btn btn-dark w-100 mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" class="card-img-top p-3" alt="Placeholder">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title h6">Product Item 2</h5>
                        <p class="card-text fw-bold text-primary mb-3">$79.00</p>
                        <button class="btn btn-dark w-100 mt-auto">Add to Cart</button>
                    </div>
                </div>
             </div>
             <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" class="card-img-top p-3" alt="Placeholder">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title h6">Product Item 3</h5>
                        <p class="card-text fw-bold text-primary mb-3">$99.00</p>
                        <button class="btn btn-dark w-100 mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1605733513597-a8f8341084e6?q=80&w=1229&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" class="card-img-top p-3" alt="Placeholder">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title h6">Product Item 4</h5>
                        <p class="card-text fw-bold text-primary mb-3">$29.00</p>
                        <button class="btn-dark w-100 mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
